<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Factory Dashboard</title>

<style>
    body {
        font-family: Arial;
        background: #f4f4f4;
        text-align: center;
    }

    .card {
        background: white;
        padding: 20px;
        margin: 20px auto;
        width: 300px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px gray;
    }
    </style>

</head>
<body>

    <h2>Factory Monitoring System</h2>
    <div class="card" id="data"></div>

    <script>
        fetch("data.json")
        .then(res => res.json())
        .then(data => {
            document.getElementById("data").innerHTML =
                "Temperature: " + data.temperature +
                "<br>Production: " + data.production +
                "<br>Machine: " + (data.machine ? "ON" : "OFF");
        });
    </script>

</body>
</html>
